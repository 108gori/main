<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="2026년 상반기 안전점검 보고서의 장별 요약을 검색합니다.">
  <title>2026 안전점검 보고서 | 장별 검색</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      color: #172b3a;
      background: #f3f7f9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      line-height: 1.6;
    }

    header {
      padding: 3rem max(1.25rem, calc((100% - 1080px) / 2));
      color: #fff;
      background: #123b52;
    }

    header p { margin: 0.4rem 0 0; color: #d2e5ed; }
    h1 { margin: 0; font-size: clamp(1.7rem, 4vw, 2.5rem); }
    main { width: min(1080px, calc(100% - 2rem)); margin: 2rem auto 4rem; }
    h2 { margin: 0 0 1rem; font-size: 1.35rem; }

    .search-panel, .resource, .chapter-card {
      border: 1px solid #d9e3e8;
      border-radius: 12px;
      background: #fff;
    }

    .search-panel { padding: 1.25rem; }
    label { display: block; margin-bottom: 0.4rem; font-weight: 700; }

    input {
      width: 100%;
      padding: 0.8rem 0.9rem;
      border: 1px solid #9fb2bd;
      border-radius: 8px;
      font: inherit;
    }

    input:focus { outline: 3px solid #a8d7e8; border-color: #176789; }
    #result-count { margin: 0.7rem 0 0; color: #405968; font-weight: 700; }
    #chapters { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; margin-top: 1rem; }
    .chapter-card { padding: 1.2rem; }
    .chapter-number { margin: 0 0 0.3rem; color: #176789; font-size: 0.9rem; font-weight: 700; }
    .chapter-card h3 { margin: 0 0 0.6rem; font-size: 1.15rem; }
    .chapter-card p:last-child { margin: 0; color: #405968; white-space: pre-line; }
    .status { padding: 1rem; color: #405968; }
    .resource { display: grid; grid-template-columns: minmax(0, 1fr) minmax(240px, 0.8fr); gap: 1.25rem; align-items: center; margin-top: 2.5rem; padding: 1rem; }
    .resource p { margin: 0; color: #405968; }
    .resource img { display: block; width: 100%; max-height: 260px; object-fit: cover; border-radius: 8px; }

    @media (max-width: 640px) {
      header { padding-top: 2rem; padding-bottom: 2rem; }
      .resource { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>2026 안전점검 보고서</h1>
    <p>보고서의 장별 요약을 검색하고 확인할 수 있습니다.</p>
  </header>
  <main>
    <section aria-labelledby="chapters-heading">
      <h2 id="chapters-heading">장별 내용 검색</h2>
      <div class="search-panel">
        <label for="keyword">키워드</label>
        <input id="keyword" type="search" placeholder="제목 또는 본문 검색" autocomplete="off">
        <p id="result-count" aria-live="polite">장 데이터를 불러오는 중...</p>
      </div>
      <div id="chapters" aria-live="polite"></div>
    </section>

    <section class="resource" aria-labelledby="resource-heading">
      <div>
        <h2 id="resource-heading">안전점검 현장 참고 이미지</h2>
        <p>외부 이미지 리소스입니다. 이미지 제공 사이트의 연결 상태에 따라 표시되지 않을 수 있습니다.</p>
      </div>
      <img
        src="https://images.unsplash.com/photo-1504307651254-35680f356dfd?auto=format&amp;fit=crop&amp;w=1000&amp;q=80"
        alt="건설 현장에서 안전모를 착용하고 작업하는 사람들"
        loading="lazy">
    </section>
  </main>
  <script>
    const searchInput = document.querySelector("#keyword");
    const chapterContainer = document.querySelector("#chapters");
    const resultCount = document.querySelector("#result-count");
    let chapters = [];

    function renderChapters() {
      const keyword = searchInput.value.trim().toLocaleLowerCase();
      const matched = chapters.filter((chapter) =>
        `${chapter.제목}\n${chapter.본문}`.toLocaleLowerCase().includes(keyword)
      );

      resultCount.textContent = `결과 ${matched.length}건`;
      chapterContainer.replaceChildren();

      if (matched.length === 0) {
        const emptyMessage = document.createElement("p");
        emptyMessage.className = "status";
        emptyMessage.textContent = "검색 결과가 없습니다.";
        chapterContainer.append(emptyMessage);
        return;
      }

      for (const chapter of matched) {
        const card = document.createElement("article");
        card.className = "chapter-card";

        const number = document.createElement("p");
        number.className = "chapter-number";
        number.textContent = `${chapter.장}장`;

        const title = document.createElement("h3");
        title.textContent = chapter.제목;

        const summary = document.createElement("p");
        summary.textContent = chapter.본문
          .replace(/\*\*/g, "")
          .replace(/\s+/g, " ")
          .trim();

        card.append(number, title, summary);
        chapterContainer.append(card);
      }
    }

    searchInput.addEventListener("input", renderChapters);

    fetch("./장데이터.json")
      .then((response) => {
        if (!response.ok) {
          throw new Error(`장데이터.json 요청 실패 (${response.status})`);
        }
        return response.json();
      })
      .then((data) => {
        if (!Array.isArray(data)) {
          throw new Error("장데이터.json 형식이 배열이 아닙니다.");
        }
        chapters = data;
        renderChapters();
      })
      .catch((error) => {
        resultCount.textContent = "장 데이터를 불러오지 못했습니다.";
        const errorMessage = document.createElement("p");
        errorMessage.className = "status";
        errorMessage.textContent = error.message;
        chapterContainer.replaceChildren(errorMessage);
      });
  </script>
</body>
</html>
